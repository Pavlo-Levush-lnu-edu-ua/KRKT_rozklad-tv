<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Розклад викладачів — TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a1120;
      --panel: #101a2e;
      --gold: #d4a72c;
      --live: #ff6b35;
      --text: #f4f0e6;
      --muted: #5f7189;
      --divider: #22314c;
      --today-tint: rgba(212, 167, 44, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .board {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(1200px 600px at 85% -10%, rgba(212, 167, 44, 0.08), transparent 60%), var(--bg);
    }

    /* ---- Top bar ---- */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px clamp(14px, 3vw, 44px) 8px;
    }

    .inst {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: clamp(12px, 1.3vw, 19px);
      letter-spacing: 0.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.5vw, 16px);
      flex-shrink: 0;
    }

    .week-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(10px, 0.9vw, 12px);
      font-weight: 700;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: 5px clamp(8px, 1.2vw, 14px);
      text-transform: uppercase;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    .clock {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: clamp(16px, 2.2vw, 30px);
      color: var(--gold);
      display: flex;
      align-items: baseline;
      gap: clamp(6px, 1vw, 12px);
      white-space: nowrap;
    }

    .clock .date {
      font-size: clamp(10px, 1vw, 15px);
      color: var(--muted);
      font-weight: 400;
      text-transform: capitalize;
    }

    /* ---- Teacher header ---- */
    .scene {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      opacity: 1;
      transition: opacity 0.45s ease;
    }

    .scene.fade {
      opacity: 0;
    }

    .teacher-head {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.6vw, 18px);
      padding: 10px clamp(14px, 3vw, 44px) 8px;
      min-width: 0;
    }

    .avatar {
      width: clamp(40px, 4.2vw, 54px);
      height: clamp(40px, 4.2vw, 54px);
      border-radius: 50%;
      background: linear-gradient(145deg, var(--gold), #8a6d1a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: clamp(15px, 1.6vw, 21px);
      color: #0a1120;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .teacher-name {
      font-family: 'Unbounded', sans-serif;
      font-weight: 900;
      font-size: clamp(22px, 3vw, 38px);
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .teacher-sub {
      color: var(--muted);
      font-size: clamp(12px, 1.2vw, 16px);
      margin-top: 4px;
      font-weight: 500;
    }

    /* ---- Week grid ---- */
    .weekwrap {
      flex: 1;
      min-height: 0;
      padding: 0 clamp(14px, 3.4vw, 48px) 12px;
      overflow: hidden;
      display: flex;
    }

    .weekgrid {
      flex: 1;
      display: grid;
      border: 1px solid var(--divider);
      border-radius: 16px;
      overflow: hidden;
      background: var(--panel);
    }

    /* ---- Перемикач днів (використовується лише на вузьких екранах — див. медіа-запити) ---- */
    .day-tabs {
      display: none;
      gap: 6px;
      padding: 0 clamp(14px, 3.4vw, 48px) 8px;
    }

    .day-tab {
      flex: 1;
      text-align: center;
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 11px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--divider);
      border-radius: 20px;
      padding: 7px 2px;
      text-transform: uppercase;
      letter-spacing: .2px;
      cursor: pointer;
    }

    .day-tab.today {
      color: var(--text);
    }

    .day-tab.active {
      color: var(--gold);
      border-color: var(--gold);
      background: var(--today-tint);
    }

    .cell {
      border-right: 1px solid var(--divider);
      border-bottom: 1px solid var(--divider);
      padding: 6px clamp(4px, 1vw, 12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .cell:last-child {
      border-right: none;
    }

    .cell.head {
      border-bottom: 2px solid var(--divider);
      background: rgba(255, 255, 255, 0.02);
      align-items: center;
      text-align: center;
      padding: 8px 4px;
    }

    .cell.head.today {
      background: var(--today-tint);
    }

    .day-name {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: clamp(10px, 1.3vw, 17px);
      text-transform: capitalize;
    }

    .cell.head.today .day-name {
      color: var(--gold);
    }

    .time-col {
      background: rgba(255, 255, 255, 0.02);
      align-items: center;
      text-align: center;
    }

    .time-col .pair-num {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: clamp(9px, 0.9vw, 13px);
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .3px;
      margin-bottom: 2px;
    }

    .time-col .t1 {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: clamp(12px, 1.3vw, 18px);
    }

    .time-col .t2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(9px, 0.9vw, 12px);
      color: var(--muted);
    }

    .lesson .subj {
      font-size: clamp(10px, 1.1vw, 16px);
      font-weight: 600;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .lesson .group {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(9px, 0.9vw, 13px);
      color: var(--muted);
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .lesson .room {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(9px, 0.9vw, 13px);
      color: var(--gold);
      margin-top: 1px;
    }

    .empty-cell {
      color: var(--muted);
      font-size: clamp(11px, 1.2vw, 17px);
      font-style: italic;
      opacity: .5;
      text-align: center;
    }

    .cell.today-col {
      background: var(--today-tint);
    }

    .cell.live {
      background: linear-gradient(160deg, rgba(255, 107, 53, 0.18), rgba(255, 107, 53, 0.05));
      box-shadow: inset 0 0 0 2px var(--live);
    }

    /* ---- Пів-пари: клітинка показує одну половину за раз, з міткою в кутку і плавним переходом ---- */
    .cell.half-pair {
      transition: opacity 0.35s ease;
    }

    .cell.half-fade {
      opacity: 0;
    }

    .half-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .3px;
      position: absolute;
      top: 6px;
      left: 10px;
      background: rgba(212, 167, 44, 0.12);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .live-tag {
      position: absolute;
      top: 6px;
      right: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--live);
      letter-spacing: .5px;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .4;
      }
    }

    /* ---- Footer ---- */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px clamp(14px, 3.4vw, 48px) 14px;
    }

    .dots {
      display: flex;
      gap: clamp(5px, .8vw, 8px);
      flex-shrink: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--divider);
    }

    .dot.active {
      background: var(--gold);
      width: 24px;
      border-radius: 5px;
      transition: all .3s;
    }

    .next-teacher {
      color: var(--muted);
      font-size: clamp(10px, 1vw, 14px);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .next-teacher b {
      color: var(--text);
    }

    /* ---- Logo / banner ---- */
    .inst-group {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .logo-img {
      max-width: clamp(110px, 17vw, 240px);
      max-height: clamp(36px, 5.5vw, 64px);
      object-fit: contain;
    }

    .banner {
      width: 100%;
      height: clamp(40px, 8vw, 84px);
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--divider);
    }

    /* ---- Debug panel ---- */
    /* ---- Прихована кнопка повноекранного режиму (hover у правому верхньому куті) ---- */
    .fs-trigger-zone {
      position: fixed;
      top: 0;
      right: 0;
      width: 110px;
      height: 110px;
      z-index: 998;
      /* невидима зона-пастка для наведення мишею/курсором пульта */
    }

    .fs-btn {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 999;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: rgba(10, 17, 32, 0.92);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .fs-trigger-zone:hover ~ .fs-btn,
    .fs-btn:hover,
    .fs-btn:focus {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* ---- Прихована панель швидкого переходу до викладача (hover у лівому верхньому куті) ---- */
    .teacher-trigger-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 110px;
      height: 110px;
      z-index: 998;
    }

    .teacher-jump-panel {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 240px;
      background: rgba(10, 17, 32, 0.92);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 10px 14px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .teacher-trigger-zone:hover ~ .teacher-jump-panel,
    .teacher-jump-panel:hover,
    .teacher-jump-panel:focus-within {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .teacher-jump-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .teacher-jump-panel select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--divider);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      cursor: pointer;
    }

    .debug-panel {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 999;
      background: rgba(10, 17, 32, 0.95);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .debug-panel.show {
      display: block;
    }

    .debug-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .debug-hint {
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 11px;
    }

    .debug-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .debug-label {
      color: var(--muted);
      min-width: 190px;
    }

    .debug-value {
      color: var(--text);
      font-weight: 700;
    }

    .debug-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--divider);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
    }

    .debug-btn.active {
      background: var(--gold);
      color: #0a1120;
      border-color: var(--gold);
    }

    /* =====================================================================
       РЕКЛАМНІ СЛАЙДИ / ОГОЛОШЕННЯ
       Вставляються в ротацію між викладачами (config.adsEvery).
       Три макети: split (фото + текст), poster (фото на весь слайд), text.
       ===================================================================== */
    .scene[hidden],
    .ann-scene[hidden] {
      display: none;
    }

    .ann-scene {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 6px clamp(14px, 3vw, 44px) 8px;
      opacity: 1;
      transition: opacity 0.45s ease;
    }

    .ann-scene.fade {
      opacity: 0;
    }

    .ann-card {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: grid;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid var(--divider);
      background:
        radial-gradient(900px 500px at 0% 0%, rgba(212, 167, 44, 0.10), transparent 60%),
        linear-gradient(145deg, #101a2e 0%, #0d1526 100%);
    }

    .ann-card.layout-split {
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    }

    .ann-card.layout-text,
    .ann-card.layout-poster {
      grid-template-columns: minmax(0, 1fr);
    }

    .ann-copy {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(10px, 2vh, 26px);
      padding: clamp(18px, 3.4vw, 68px);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .ann-kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(11px, 1.1vw, 19px);
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      background: rgba(212, 167, 44, 0.10);
      border-radius: 999px;
      padding: 0.35em 1em;
    }

    .ann-title {
      font-family: 'Unbounded', sans-serif;
      font-weight: 900;
      font-size: clamp(26px, 4.6vw, 80px);
      line-height: 1.05;
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ann-title .accent {
      color: var(--gold);
    }

    .ann-text {
      font-size: clamp(15px, 1.95vw, 38px);
      line-height: 1.4;
      color: #d8d4c8;
      white-space: pre-line;
      max-width: 38em;
      display: -webkit-box;
      -webkit-line-clamp: 9;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ann-foot {
      display: flex;
      align-items: flex-end;
      gap: clamp(14px, 2vw, 32px);
      margin-top: clamp(4px, 1vh, 14px);
      min-width: 0;
    }

    .ann-qr {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ann-qr svg {
      display: block;
      width: clamp(96px, 12vw, 230px);
      height: clamp(96px, 12vw, 230px);
      border-radius: 12px;
    }

    .ann-qr-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(10px, 1.05vw, 19px);
      color: var(--muted);
      text-align: center;
      max-width: 14em;
    }

    .ann-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(12px, 1.4vw, 26px);
      line-height: 1.5;
      color: var(--gold);
      white-space: pre-line;
      border-left: 3px solid var(--gold);
      padding-left: clamp(10px, 1.2vw, 18px);
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .ann-card.layout-video {
      display: block;
      background: #0d1138;
    }

    /* Відео-оголошення займає весь екран (без шапки, підвалу і рамки): ролик 16:9 заповнює екран 16:9 впритул.
       z-index нижчий за службові панелі (debug / повноекранна кнопка — 998–999). */
    .ann-scene.is-video {
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 0;
      background: #0d1138;
    }

    .ann-scene.is-video .ann-card {
      border: 0;
      border-radius: 0;
    }

    .ann-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* ролик показуємо цілком, без обрізання країв (логотипи, текст) */
      background: #0d1138;
      pointer-events: none;
    }

    .ann-media {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #0b1322;
    }

    .ann-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ann-card.fit-contain .ann-media img {
      object-fit: contain;
    }

    /* плавне зшивання фото з текстовою колонкою */
    .layout-split .ann-media::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #101a2e 0%, rgba(16, 26, 46, 0) 24%);
      pointer-events: none;
    }

    /* poster: фото на весь слайд, текст — внизу на градієнті */
    .layout-poster .ann-media {
      position: absolute;
      inset: 0;
    }

    .layout-poster .ann-copy {
      align-self: end;
      justify-content: flex-end;
      padding-top: clamp(60px, 14vh, 200px);
      background: linear-gradient(0deg, rgba(8, 13, 25, 0.94) 0%, rgba(8, 13, 25, 0.75) 55%, rgba(8, 13, 25, 0) 100%);
    }

    .layout-poster .ann-title {
      -webkit-line-clamp: 2;
    }

    .layout-poster .ann-text {
      -webkit-line-clamp: 3;
    }

    /* text: тільки типографіка */
    .layout-text .ann-title {
      font-size: clamp(32px, 6.4vw, 110px);
    }

    .layout-text .ann-text {
      font-size: clamp(16px, 2.1vw, 38px);
    }

    /* смужка, що показує, скільки лишилось до кінця слайду */
    .ann-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      z-index: 2;
      background: rgba(255, 255, 255, 0.06);
    }

    .ann-progress i {
      display: block;
      height: 100%;
      background: var(--gold);
      transform-origin: left center;
      animation: annProgress var(--ann-dur, 12s) linear forwards;
    }

    @keyframes annProgress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* режим попереднього перегляду всередині адмінки (index.html?annpreview=1):
       тільки слайд, без шапки/підвалу/службових панелей */
    body.ann-preview .topbar,
    body.ann-preview .footer,
    body.ann-preview .banner,
    body.ann-preview .scene,
    body.ann-preview .fs-trigger-zone,
    body.ann-preview .fs-btn,
    body.ann-preview .teacher-trigger-zone,
    body.ann-preview .teacher-jump-panel,
    body.ann-preview .debug-panel,
    body.ann-preview .ann-progress {
      display: none !important;
    }

    body.ann-preview .ann-scene {
      padding: 0;
    }

    body.ann-preview .ann-card {
      border-radius: 0;
      border: 0;
    }

    /* =====================================================================
       RESPONSIVE
       Ідея та стиль сайту не змінюються — нижче лише перебудова layout-у
       під менші екрани (планшет/мобільний) і дрібне тонке налаштування
       для проміжних desktop/laptop-ширин.
       ===================================================================== */

    /* ---- Laptop / менші desktop-монітори: трохи щільніше, без зміни структури ---- */
    @media (max-width: 1366px) {
      .teacher-head { gap: 14px; }
      .weekwrap { padding-left: 28px; padding-right: 28px; }
    }

    @media (max-width: 1024px) {
      .topbar, .teacher-head, .footer { padding-left: 20px; padding-right: 20px; }
      .weekwrap { padding-left: 20px; padding-right: 20px; }
    }

    /* ---- Планшет/мобільний: TV-«board» більше не займає рівно один екран
       без скролу — контенту забагато для читабельного вигляду в один viewport,
       тож дозволяємо вертикальний скрол сторінки замість обрізання/накладання. ---- */
    @media (max-width: 860px) {
      html, body {
        overflow-y: auto;
        overflow-x: hidden;
        height: auto;
        min-height: 100%;
      }

      .board {
        height: auto;
        min-height: 100dvh;
      }

      .topbar {
        flex-wrap: wrap;
        row-gap: 8px;
        padding-top: 16px;
      }

      .teacher-head {
        padding-top: 6px;
        padding-bottom: 6px;
      }

      /* Показуємо перемикач днів і переводимо тижневу сітку в режим
         "один день за раз": час зліва, пари обраного дня — праворуч.
         Сама сітка (JS) на цій ширині рендерить лише 2 колонки. */
      .day-tabs {
        display: flex;
      }

      .weekwrap {
        overflow: visible;
        padding-bottom: 20px;
      }

      .weekgrid {
        overflow: visible;
      }

      .cell {
        min-height: 62px;
        padding: 8px 10px;
      }

      .cell.lesson {
        align-items: flex-start;
      }

      /* Реклама на вузькому екрані: фото зверху, текст під ним */
      .ann-scene {
        padding-bottom: 14px;
      }

      .ann-card.layout-split {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(180px, 36vh) auto;
      }

      .layout-split .ann-media {
        order: -1;
      }

      .layout-split .ann-media::after {
        background: linear-gradient(0deg, #101a2e 0%, rgba(16, 26, 46, 0) 30%);
      }

      .layout-poster {
        min-height: 60vh;
      }

      /* Приховані по hover панелі не працюють на дотик — робимо їх
         завжди доступними, компактнішими і без зон-пасток для миші. */
      .fs-trigger-zone,
      .teacher-trigger-zone {
        display: none;
      }

      .fs-btn {
        opacity: 1;
        pointer-events: auto;
        transform: none;
        top: 10px;
        right: 10px;
        padding: 7px 10px;
        font-size: 11px;
      }

      .teacher-jump-panel {
        opacity: 1;
        pointer-events: auto;
        transform: none;
        top: 10px;
        left: 10px;
        min-width: 0;
        max-width: calc(50vw - 20px);
        padding: 7px 10px;
      }

      .teacher-jump-label { font-size: 9px; }

      .teacher-jump-panel select {
        font-size: 11px;
        padding: 6px 8px;
        max-width: 100%;
      }

      .debug-panel {
        left: 8px;
        right: 8px;
        bottom: 8px;
        max-width: none;
        max-height: 60vh;
        overflow-y: auto;
      }

      .debug-label { min-width: 0; }
    }

    @media (max-width: 480px) {
      .clock { font-size: 15px; }
      .clock .date { display: none; }
      .inst { display: none; }
    }
  </style>
</head>

<body>
  <div class="board">
    <div class="topbar">
      <div class="inst-group">
        <img id="logoImg" class="logo-img" style="display:none">
      </div>
      <div class="topbar-right">
        <div class="week-badge" id="weekbadge">—</div>
        <div class="clock"><span id="time">--:--:--</span><span class="date" id="date">—</span></div>
      </div>
    </div>

    <div class="banner" id="banner" style="display:none"></div>

    <div class="scene" id="scene">
      <div class="teacher-head">
        <div class="avatar" id="avatar">Б</div>
        <div>
          <div class="teacher-name" id="tname">—</div>
          <div class="teacher-sub" id="tsub">—</div>
        </div>
      </div>

      <div class="day-tabs" id="dayTabs"></div>

      <div class="weekwrap">
        <div class="weekgrid" id="weekgrid"></div>
      </div>
    </div>

    <!-- Рекламний слайд / оголошення (показується замість .scene) -->
    <div class="ann-scene" id="annScene" hidden></div>

    <div class="footer">
      <div class="dots" id="dots"></div>
      <div class="next-teacher" id="nextteacher">Далі: <b>—</b></div>
    </div>
  </div>

  <!-- ==================== Прихована зона для входу в повноекранний режим (наведіть у правий верхній кут) ==================== -->
  <div class="fs-trigger-zone" id="fsTriggerZone"></div>
  <button class="fs-btn" id="fsBtn">⛶ Повноекранний режим</button>

  <!-- ==================== Прихована панель швидкого переходу до викладача (наведіть у лівий верхній кут) ==================== -->
  <div class="teacher-trigger-zone" id="teacherTriggerZone"></div>
  <div class="teacher-jump-panel" id="teacherJumpPanel">
    <label class="teacher-jump-label" for="teacherJumpSelect">Перейти до викладача</label>
    <select id="teacherJumpSelect"></select>
  </div>

  <!-- ==================== ДЕБАГ-ПАНЕЛЬ (натисніть «d», щоб показати/сховати) ==================== -->
  <div class="debug-panel" id="debugPanel">
    <div class="debug-title">Дебаг-режим <span class="debug-hint">(клавіша D — сховати)</span></div>
    <div class="debug-row">
      <span class="debug-label">Тиждень:</span>
      <button class="debug-btn" id="dbgAuto" data-week="auto">Авто</button>
      <button class="debug-btn" id="dbgNum" data-week="numerator">Чисельник</button>
      <button class="debug-btn" id="dbgDen" data-week="denominator">Знаменник</button>
    </div>
    <div class="debug-row">
      <span class="debug-label">Поточна пара (реальний час):</span>
      <span class="debug-value" id="dbgCurrentPeriod">—</span>
    </div>
    <div class="debug-row" id="dbgWeekendWarning" style="display:none">
      <span class="debug-warning">⚠ Сьогодні вихідний — реальний час нічого не підсвітить (тільки Пн–Пт). Скористайтесь
        «🎲 Випадкова пара».</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Тест «ЗАРАЗ»-підсвітки:</span>
      <button class="debug-btn" id="dbgRandomPeriod">🎲 Випадкова пара</button>
      <button class="debug-btn" id="dbgRealTime">Реальний час</button>
      <span class="debug-value" id="dbgForcedPeriod">не форсовано</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Розрахований тиждень (авто):</span>
      <span class="debug-value" id="dbgAutoWeek">—</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Викладач:</span>
      <button class="debug-btn" id="dbgNextTeacher">Наступний ▶</button>
    </div>
    <div class="debug-row">
      <span class="debug-label">Реклама:</span>
      <button class="debug-btn" id="dbgShowAnn">Показати наступну ▶</button>
      <span class="debug-value" id="dbgAnnInfo">—</span>
    </div>
  </div>

  <script>
    // ===================== Конфіг за замовчуванням =====================
    // semesterStart — понеділок тижня, який вважається ЧИСЕЛЬНИКОМ (перший тиждень відліку).
    // Тиждень авто-визначається від цієї дати: парна різниця тижнів → чисельник, непарна → знаменник.
    const DEFAULT_CONFIG = {
      semesterStart: "2026-09-01",
      scheduleUrl: "", // необов'язково: посилання на schedule.json (напр. з OneDrive), інакше береться локальний schedule.json поруч
      logo: "",
      banner: "",
      adsEvery: 4 // показувати рекламу після кожних N викладачів (0 — вимкнено)
    };

    const WEEKDAYS = ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця"];

    const PERIODS = [
      {num: 1, time: "08:30-09:50"},
      {num: 2, time: "10:10-11:30"},
      {num: 3, time: "11:50-13:10"},
      {num: 4, time: "13:30-14:50"},
      {num: 5, time: "15:05-16:25"},
      {num: 6, time: "16:40-18:00"},
      {num: 7, time: "18:10-19:30"},
      {num: 8, time: "19:40-21:00"},
    ];

    // Дані більше не зашиваються у файл — TV читає schedule.json (експортований з адмінки),
    // localStorage (той самий браузер) або показує заглушку "немає даних".
    const DEFAULT_TEACHERS = [];

    const ROTATE_MS = 8000; // однаковий час показу для КОЖНОГО викладача
    let teacherIdx = 0;
    let halfToggle = 0; // 0 = показуємо 1-шу половину пів-пар, 1 = 2-гу
    let teachers = DEFAULT_TEACHERS;
    let config = DEFAULT_CONFIG;

    // ---- Реклама / оголошення ----
    let ads = [];
    let view = {type: 'teacher'}; // що зараз на екрані: {type:'teacher'} або {type:'ad', ad}
    let sinceAd = 1;              // скільки слайдів-викладачів показано з моменту останнього оголошення
    let adCursor = 0;             // яке оголошення йде наступним (по колу)
    const sceneEl = document.getElementById('scene');
    const annSceneEl = document.getElementById('annScene');
    const AD_DEFAULT_SEC = 12, AD_MIN_SEC = 4, AD_MAX_SEC = 120;

    // ---- Мобільний layout: перемикач днів (замінює повну сітку на вузьких екранах) ----
    const mobileLayoutQuery = window.matchMedia('(max-width: 860px)');
    let mobileActiveDay = null; // null = показуємо сьогоднішній день (визначається у render())
    mobileLayoutQuery.addEventListener('change', () => render());
    document.getElementById('dayTabs').addEventListener('click', e => {
      const tab = e.target.closest('.day-tab');
      if (!tab) return;
      mobileActiveDay = tab.dataset.day;
      render();
    });

    function initials(name) {return name.trim().split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();}
    function toMin(hhmm) {const [h, m] = hhmm.split(":").map(Number); return h * 60 + m;}

    // ---- Визначення поточного тижня (чисельник/знаменник) ----
    function mondayOf(d) {
      const day = d.getDay(); // 0=Нд..6=Сб
      const diff = (day === 0 ? -6 : 1 - day);
      return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
    }
    function getWeekType(semesterStartStr) {
      const start = mondayOf(new Date(semesterStartStr + "T00:00:00"));
      const now = mondayOf(new Date());
      const diffDays = Math.round((now - start) / 86400000);
      const weeksDiff = Math.floor(diffDays / 7);
      const mod = ((weeksDiff % 2) + 2) % 2;
      return mod === 0 ? "numerator" : "denominator";
    }

    // ---- Дебаг: ручне перемикання тижня + індикатор поточної пари ----
    let debugWeekOverride = null; // null = авто, або 'numerator' / 'denominator'
    let debugPeriodOverride = null; // null = реальний час, або число 1..7 — форсує підсвітку "ЗАРАЗ" на цій парі (для сьогоднішнього дня)

    function getCurrentPeriodInfo() {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      for (const p of PERIODS) {
        const [t1, t2] = p.time.split('-');
        if (nowMin >= toMin(t1) && nowMin <= toMin(t2)) {
          return {period: p.num, label: `${p.num} пара (${p.time})`};
        }
      }
      return {period: null, label: 'перерва / поза розкладом'};
    }

    function updateDebugPanel(autoWeekType) {
      document.getElementById('dbgAutoWeek').textContent = autoWeekType === 'numerator' ? 'Чисельник' : 'Знаменник';
      document.getElementById('dbgCurrentPeriod').textContent = getCurrentPeriodInfo().label;
      document.getElementById('dbgAuto').classList.toggle('active', debugWeekOverride === null);
      document.getElementById('dbgNum').classList.toggle('active', debugWeekOverride === 'numerator');
      document.getElementById('dbgDen').classList.toggle('active', debugWeekOverride === 'denominator');
      document.getElementById('dbgForcedPeriod').textContent = debugPeriodOverride
        ? `пара ${debugPeriodOverride} (${PERIODS.find(p => p.num === debugPeriodOverride).time})`
        : 'не форсовано';
      document.getElementById('dbgRealTime').classList.toggle('active', debugPeriodOverride === null);
      updateAdDebugInfo();
    }

    document.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'd') {
        document.getElementById('debugPanel').classList.toggle('show');
      }
      if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // ---- Повноекранний режим ----
    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    function updateFsBtnLabel() {
      const btn = document.getElementById('fsBtn');
      btn.textContent = isFullscreen() ? '⛶ Вийти з повноекранного' : '⛶ Повноекранний режим';
    }

    function toggleFullscreen() {
      const el = document.documentElement;
      if (!isFullscreen()) {
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (req) {
          req.call(el).catch(err => console.warn('Fullscreen request failed:', err));
        } else {
          console.warn('Fullscreen API не підтримується цим браузером.');
        }
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (exit) exit.call(document);
      }
    }

    document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);
    ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(ev => {
      document.addEventListener(ev, updateFsBtnLabel);
    });
    updateFsBtnLabel();
    document.getElementById('dbgAuto').onclick = () => {debugWeekOverride = null; render();};
    document.getElementById('dbgNum').onclick = () => {debugWeekOverride = 'numerator'; render();};
    document.getElementById('dbgDen').onclick = () => {debugWeekOverride = 'denominator'; render();};
    document.getElementById('dbgRandomPeriod').onclick = () => {
      // випадкова пара з 1..PERIODS.length, гарантовано інша, ніж поточна форсована
      const nums = PERIODS.map(p => p.num).filter(n => n !== debugPeriodOverride);
      debugPeriodOverride = nums[Math.floor(Math.random() * nums.length)];
      render();
    };
    document.getElementById('dbgRealTime').onclick = () => {debugPeriodOverride = null; render();};
    document.getElementById('dbgNextTeacher').onclick = () => rotate();

    function applyBrand() {
      const logoImg = document.getElementById('logoImg');
      if (config.logo) {logoImg.src = config.logo; logoImg.style.display = '';}
      else {logoImg.style.display = 'none';}

      const banner = document.getElementById('banner');
      if (config.banner) {banner.style.backgroundImage = `url("${config.banner}")`; banner.style.display = '';}
      else {banner.style.display = 'none';}
    }

    function renderLessonInner(lesson, isLive) {
      return `${isLive ? '<span class="live-tag">● ЗАРАЗ</span>' : ''}
        <div class="subj">${lesson.subj}</div>
        <div class="group">${lesson.group}</div>
        <div class="room">ауд. ${lesson.room}</div>`;
    }

    function render() {
      applyBrand();

      // ---- Порожній стан: викладачів ще не додано ----
      if (!teachers.length) {
        document.getElementById('tname').textContent = 'Немає даних';
        document.getElementById('tsub').textContent = 'Додайте викладачів в адмінці та експортуйте schedule.json';
        document.getElementById('avatar').textContent = '?';
        document.getElementById('weekgrid').innerHTML = '';
        document.getElementById('dayTabs').innerHTML = '';
        document.getElementById('dots').innerHTML = '';
        document.getElementById('nextteacher').innerHTML = '';
        return;
      }

      const teacher = teachers[teacherIdx];
      document.getElementById('tname').textContent = teacher.name;
      document.getElementById('tsub').textContent = "Розклад занять";

      const jumpSel = document.getElementById('teacherJumpSelect');
      if (jumpSel.options.length !== teachers.length) refreshTeacherJumpOptions();
      jumpSel.value = String(teacherIdx);

      const avatarEl = document.getElementById('avatar');
      if (teacher.photo) {
        const pos = teacher.photoPos || {x: 50, y: 50, zoom: 130};
        avatarEl.innerHTML = `<img src="${teacher.photo}" alt="" style="object-position:${pos.x}% ${pos.y}%; transform:scale(${(pos.zoom / 100).toFixed(2)});">`;
      } else {
        avatarEl.textContent = initials(teacher.name);
      }

      const autoWeekType = getWeekType(config.semesterStart);
      const weekType = debugWeekOverride || autoWeekType;
      const badge = document.getElementById('weekbadge');
      badge.textContent = weekType === 'numerator' ? 'Чисельник' : 'Знаменник';
      updateDebugPanel(autoWeekType);

      const scheduleForWeek = (teacher.schedule && teacher.schedule[weekType]) || {};

      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const jsDay = now.getDay(); // 0=Нд..6=Сб
      const todayName = (jsDay >= 1 && jsDay <= 5) ? WEEKDAYS[jsDay - 1] : null;

      const grid = document.getElementById('weekgrid');
      const isMobile = mobileLayoutQuery.matches;

      // ---- Перемикач днів: показуємо тільки на вузьких екранах (CSS ховає його на desktop) ----
      if (!mobileActiveDay || !WEEKDAYS.includes(mobileActiveDay)) {
        mobileActiveDay = todayName || WEEKDAYS[0];
      }
      const dayTabsEl = document.getElementById('dayTabs');
      dayTabsEl.innerHTML = WEEKDAYS.map(day => {
        const isToday = day === todayName;
        const isActive = day === mobileActiveDay;
        return `<div class="day-tab ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}" data-day="${day}">${day.slice(0, 3)}</div>`;
      }).join('');

      let html = '';

      if (isMobile) {
        // ---- Мобільний layout: та сама розмітка клітинок, але лише 2 колонки
        //      (час + один обраний день), щоб уникнути горизонтального скролу. ----
        const day = mobileActiveDay;
        const isTodaySelected = day === todayName;
        grid.style.gridTemplateColumns = `72px 1fr`;
        grid.style.gridTemplateRows = `repeat(${PERIODS.length}, minmax(60px, auto))`;

        PERIODS.forEach(period => {
          const [t1, t2] = period.time.split('-');
          html += `<div class="cell time-col">
        <div class="pair-num">${period.num} пара</div>
        <div class="t1">${t1}</div>
        <div class="t2">${t2}</div>
      </div>`;

          const lessons = (scheduleForWeek[day] || []).filter(l => Number(l.period) === period.num);
          const full = lessons.find(l => !l.half);
          const half1 = lessons.find(l => Number(l.half) === 1);
          const half2 = lessons.find(l => Number(l.half) === 2);
          const isLive = debugPeriodOverride
            ? period.num === debugPeriodOverride
            : (isTodaySelected && nowMin >= toMin(t1) && nowMin <= toMin(t2));

          if (full) {
            html += `<div class="cell lesson ${isTodaySelected ? 'today-col' : ''} ${isLive ? 'live' : ''}">
          ${renderLessonInner(full, isLive)}
        </div>`;
          } else if (half1 || half2) {
            const shown = halfToggle === 0 ? half1 : half2;
            html += `<div class="cell lesson half-pair ${isTodaySelected ? 'today-col' : ''} ${shown && isLive ? 'live' : ''}">
          ${shown ? renderLessonInner(shown, isLive) : '<div class="empty-cell">—</div>'}
        </div>`;
          } else {
            html += `<div class="cell ${isTodaySelected ? 'today-col' : ''}"><div class="empty-cell">—</div></div>`;
          }
        });

        grid.innerHTML = html;
      } else {
        // ---- Desktop / laptop / tablet-альбомна: повна сітка тиждень×пари, без змін ----
        grid.style.gridTemplateColumns = `140px repeat(${WEEKDAYS.length}, 1fr)`;
        grid.style.gridTemplateRows = `48px repeat(${PERIODS.length}, minmax(0, 1fr))`;

        html += `<div class="cell time-col head"></div>`;
        WEEKDAYS.forEach(day => {
          const isToday = day === todayName;
          html += `<div class="cell head ${isToday ? 'today' : ''}">
        <div class="day-name">${day}</div>
      </div>`;
        });

        PERIODS.forEach(period => {
          const [t1, t2] = period.time.split('-');
          html += `<div class="cell time-col">
        <div class="pair-num">${period.num} пара</div>
        <div class="t1">${t1}</div>
        <div class="t2">${t2}</div>
      </div>`;
          WEEKDAYS.forEach(day => {
            const isToday = day === todayName;
            const lessons = (scheduleForWeek[day] || []).filter(l => Number(l.period) === period.num);
            const full = lessons.find(l => !l.half);
            const half1 = lessons.find(l => Number(l.half) === 1);
            const half2 = lessons.find(l => Number(l.half) === 2);
            const isLive = debugPeriodOverride
              ? period.num === debugPeriodOverride
              : (isToday && nowMin >= toMin(t1) && nowMin <= toMin(t2));

            if (full) {
              html += `<div class="cell lesson ${isToday ? 'today-col' : ''} ${isLive ? 'live' : ''}">
            ${renderLessonInner(full, isLive)}
          </div>`;
            } else if (half1 || half2) {
              const shown = halfToggle === 0 ? half1 : half2;
              html += `<div class="cell lesson half-pair ${isToday ? 'today-col' : ''} ${shown && isLive ? 'live' : ''}">
            ${shown ? renderLessonInner(shown, isLive) : '<div class="empty-cell">—</div>'}
          </div>`;
            } else {
              html += `<div class="cell ${isToday ? 'today-col' : ''}"><div class="empty-cell">—</div></div>`;
            }
          });
        });

        grid.innerHTML = html;
      }

      renderFooter();
    }

    function tick() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('uk-UA');
      document.getElementById('date').textContent = now.toLocaleDateString('uk-UA', {weekday: 'long', day: 'numeric', month: 'long'});
      document.getElementById('dbgCurrentPeriod').textContent = getCurrentPeriodInfo().label;
    }
    setInterval(tick, 1000); tick();

    const FADE_MS = 450; // має збігатись із transition в CSS (.scene)

    let halfFlipTimer = null;

    function scheduleHalfFlip() {
      halfToggle = 0; // кожен новий слайд починається з 1-ї половини
      if (halfFlipTimer) clearInterval(halfFlipTimer);
      // перемикаємо рівно посередині часу показу слайду (напр. 8с слайд -> перемикання на 4-й секунді)
      halfFlipTimer = setInterval(() => {
        halfToggle = halfToggle === 0 ? 1 : 0;
        render();
      }, ROTATE_MS / 2);
    }

    // ---- Що показувати далі: викладач чи оголошення ----
    function escHtml(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function adIsActive(ad, today) {
      if (!ad || ad.enabled === false) return false;
      if (ad.startDate && today < ad.startDate) return false;
      if (ad.endDate && today > ad.endDate) return false;
      return !!(ad.title || ad.text || ad.image || ad.video); // порожнє оголошення не показуємо
    }

    function activeAds() {
      const today = todayStr();
      return (Array.isArray(ads) ? ads : []).filter(a => adIsActive(a, today));
    }

    function adDurationSec(ad) {
      const n = Number(ad && ad.duration);
      return Math.min(AD_MAX_SEC, Math.max(AD_MIN_SEC, n > 0 ? n : AD_DEFAULT_SEC));
    }

    // Чистий розрахунок (нічого не змінює) — використовується і для ротації, і для підпису «Далі».
    function planNext() {
      const list = activeAds();
      const every = Math.floor(Number(config.adsEvery));
      // два оголошення поспіль не показуємо
      if (view.type !== 'ad' && list.length && every > 0 && sinceAd >= every) {
        return {type: 'ad', ad: list[adCursor % list.length]};
      }
      return {type: 'teacher', idx: (teacherIdx + 1) % teachers.length};
    }

    function rotate() {
      if (!teachers.length) return;
      const nxt = planNext();
      if (nxt.type === 'ad') showAd(nxt.ad);
      else showTeacher(nxt.idx);
    }

    function jumpToTeacher(idx) {showTeacher(idx, true);}

    function currentSceneEl() {return view.type === 'ad' ? annSceneEl : sceneEl;}

    // Плавний перехід: поточна сцена згасає, apply() міняє вміст і показує потрібну сцену, нова проявляється.
    function transitionTo(apply, ms) {
      scheduleAutoRotate(ms); // таймер скидаємо одразу — і при ручному виборі, і при звичайній ротації
      const cur = currentSceneEl();
      cur.classList.add('fade');
      setTimeout(() => {
        apply();
        const nxt = currentSceneEl();
        // невелика затримка, щоб браузер встиг застосувати новий вміст перед fade-in
        requestAnimationFrame(() => requestAnimationFrame(() => nxt.classList.remove('fade')));
      }, FADE_MS);
    }

    function showTeacher(idx, manual) {
      if (!teachers.length) return;
      if (view.type === 'teacher' && idx === teacherIdx) {scheduleAutoRotate(ROTATE_MS); return;}
      if (!manual) sinceAd++;
      transitionTo(() => {
        view = {type: 'teacher'};
        teacherIdx = idx;
        annSceneEl.hidden = true;
        annSceneEl.innerHTML = '';
        sceneEl.hidden = false;
        sceneEl.classList.add('fade');
        scheduleHalfFlip();
        render();
      }, ROTATE_MS);
    }

    function showAd(ad, manual) {
      if (!manual) sinceAd = 0;
      adCursor++;
      transitionTo(() => {
        view = {type: 'ad', ad};
        if (halfFlipTimer) {clearInterval(halfFlipTimer); halfFlipTimer = null;}
        renderAd(ad);
        sceneEl.hidden = true;
        annSceneEl.hidden = false;
        annSceneEl.classList.add('fade');
        renderFooter();
      }, adDurationSec(ad) * 1000 + FADE_MS); // + час на згасання попереднього слайду
    }

    function renderFooter() {
      const dots = document.getElementById('dots');
      const nextEl = document.getElementById('nextteacher');
      if (!teachers.length) {dots.innerHTML = ''; nextEl.innerHTML = ''; return;}
      const onAd = view.type === 'ad';
      dots.innerHTML = teachers.map((_, i) => `<div class="dot ${!onAd && i === teacherIdx ? 'active' : ''}"></div>`).join('');
      const nxt = planNext();
      nextEl.innerHTML = nxt.type === 'ad'
        ? `Далі: <b>Оголошення${nxt.ad.title ? ' — ' + escHtml(String(nxt.ad.title).replace(/\*/g, '')) : ''}</b>`
        : `Далі: <b>${escHtml(teachers[nxt.idx].name)}</b>`;
    }

    function updateAdDebugInfo() {
      const el = document.getElementById('dbgAnnInfo');
      if (!el) return;
      const n = Array.isArray(ads) ? ads.length : 0;
      const every = Math.floor(Number(config.adsEvery)) || 0;
      el.textContent = `активних: ${activeAds().length} з ${n}; ` + (every > 0 ? `після кожних ${every} викладачів` : 'показ вимкнено');
    }

    document.getElementById('dbgShowAnn').onclick = () => {
      const list = activeAds();
      if (!list.length) return;
      showAd(list[adCursor % list.length], true);
    };

    // ---- Побудова рекламного слайду ----
    // QR як SVG (із тихою зоною 4 модулі навколо) — без зовнішніх сервісів.
    function qrSvg(text) {
      try {
        qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
        const qr = qrcode(0, 'M');
        qr.addData(String(text));
        qr.make();
        const n = qr.getModuleCount(), q = 4;
        let d = '';
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            if (!qr.isDark(y, x)) continue;
            let run = 1;
            while (x + run < n && qr.isDark(y, x + run)) run++;
            d += `M${x + q} ${y + q}h${run}v1h-${run}z`;
            x += run - 1;
          }
        }
        const size = n + q * 2;
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="QR-код">` +
          `<rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#0a1120"/></svg>`;
      } catch (e) {
        return ''; // напр. надто довге посилання — просто не показуємо QR
      }
    }

    // У заголовку *слово* підсвічується золотим
    function fmtTitle(str) {
      return escHtml(str).replace(/\*([^*]+)\*/g, '<span class="accent">$1</span>');
    }

    function renderAd(ad) {
      let layout = ['split', 'poster', 'text', 'video'].includes(ad.layout) ? ad.layout : 'split';
      if (layout === 'video' && !ad.video) layout = ad.image ? 'poster' : 'text';
      if (layout !== 'text' && layout !== 'video' && !ad.image) layout = 'text'; // без картинки фото-макети не мають сенсу
      annSceneEl.classList.remove('is-video');
      if (layout === 'video') {renderVideoAd(ad); return;}
      const qr = ad.qrUrl ? qrSvg(ad.qrUrl) : '';
      const dur = adDurationSec(ad);

      annSceneEl.innerHTML =
        `<div class="ann-card layout-${layout}${ad.imageFit === 'contain' ? ' fit-contain' : ''}" style="--ann-dur:${dur}s">` +
        `<div class="ann-copy">` +
        (ad.kicker ? `<span class="ann-kicker">${escHtml(ad.kicker)}</span>` : '') +
        (ad.title ? `<h1 class="ann-title">${fmtTitle(ad.title)}</h1>` : '') +
        (ad.text ? `<p class="ann-text">${escHtml(ad.text)}</p>` : '') +
        ((qr || ad.meta) ? `<div class="ann-foot">` +
          (qr ? `<div class="ann-qr">${qr}${ad.qrLabel ? `<span class="ann-qr-label">${escHtml(ad.qrLabel)}</span>` : ''}</div>` : '') +
          (ad.meta ? `<div class="ann-meta">${escHtml(ad.meta)}</div>` : '') +
          `</div>` : '') +
        `</div>` +
        (layout !== 'text' ? `<div class="ann-media"><img alt=""></div>` : '') +
        `<div class="ann-progress"><i></i></div>` +
        `</div>`;

      // картинку задаємо через властивість, а не через рядок HTML (data-URI може бути дуже довгим)
      const img = annSceneEl.querySelector('.ann-media img');
      if (img) {
        img.src = ad.image;
        const x = Number.isFinite(Number(ad.imageX)) ? Number(ad.imageX) : 50;
        const y = Number.isFinite(Number(ad.imageY)) ? Number(ad.imageY) : 50;
        img.style.objectPosition = `${x}% ${y}%`;
      }
    }

    // Відео-оголошення: MP4 лежить у репозиторії поруч з index.html (шлях/URL у ad.video).
    // Тривалість слайду = тривалість ролика (визначається після завантаження метаданих);
    // поки метаданих нема — діє ad.duration. Без звуку (потрібно для автозапуску на TV).
    function renderVideoAd(ad) {
      const preview = document.body.classList.contains('ann-preview');
      annSceneEl.classList.add('is-video');
      annSceneEl.innerHTML =
        `<div class="ann-card layout-video">` +
        `<video class="ann-video" muted playsinline preload="auto" disablepictureinpicture disableremoteplayback controlslist="nodownload noremoteplayback nofullscreen"${preview ? ' loop' : ''}></video>` +
        `</div>`;
      const v = annSceneEl.querySelector('video');
      v.muted = true;
      if (!preview) {
        v.addEventListener('loadedmetadata', () => {
          if (view.type !== 'ad' || view.ad !== ad || !isFinite(v.duration)) return;
          const sec = Math.min(300, Math.max(AD_MIN_SEC, v.duration));
          scheduleAutoRotate(sec * 1000 + 500);
        });
        v.addEventListener('error', () => {
          if (view.type === 'ad' && view.ad === ad) scheduleAutoRotate(800); // файл не знайдено — одразу далі
        });
      }
      v.src = ad.video;
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    }

    // ---- Автоперемотка з можливістю скидання таймера (напр. після ручного вибору викладача) ----
    let autoRotateTimer = null;

    function scheduleAutoRotate(ms) {
      if (autoRotateTimer) clearTimeout(autoRotateTimer);
      autoRotateTimer = setTimeout(autoRotateTick, ms || ROTATE_MS);
    }

    function autoRotateTick() {
      // Не гортаємо автоматично, поки відкрита дебаг-панель (D) — щоб можна було спокійно тестувати.
      if (!document.getElementById('debugPanel').classList.contains('show')) {
        rotate();
      } else {
        scheduleAutoRotate();
      }
    }

    // ---- Прихована панель швидкого переходу до викладача ----
    function refreshTeacherJumpOptions() {
      const sel = document.getElementById('teacherJumpSelect');
      sel.innerHTML = teachers.map((t, i) => `<option value="${i}">${t.name}</option>`).join('');
      sel.value = String(teacherIdx);
    }

    document.getElementById('teacherJumpSelect').addEventListener('change', e => {
      jumpToTeacher(Number(e.target.value));
    });

    // ---- Завантаження даних ----
    // Пріоритет: 1) config.scheduleUrl (напр. пряме посилання на файл у OneDrive) якщо задано в самих даних
    //            2) локальний schedule.json поруч із цим файлом (напр. синхронізована папка OneDrive + локальний сервер)
    //            3) localStorage (той самий браузер, що і адмінка)
    //            4) вбудовані дані за замовчуванням
    async function fetchJson(url) {
      const res = await fetch(url, {cache: 'no-store'});
      if (!res.ok) throw new Error('bad status');
      return res.json();
    }

    async function loadData() {
      // спершу локальний schedule.json — з нього ж читаємо, чи не вказано зовнішній scheduleUrl
      let payload = null;
      try {payload = await fetchJson('schedule.json');} catch (e) { }

      if (payload && payload.config && payload.config.scheduleUrl) {
        try {payload = await fetchJson(payload.config.scheduleUrl);} catch (e) { /* лишаємо те, що є */}
      }

      if (!payload) {
        try {
          const raw = localStorage.getItem('rozklad_data');
          if (raw) payload = JSON.parse(raw);
        } catch (e) { }
      }

      if (payload && Array.isArray(payload.teachers) && payload.teachers.length) {
        return {
          teachers: payload.teachers,
          config: Object.assign({}, DEFAULT_CONFIG, payload.config || {}),
          ads: Array.isArray(payload.ads) ? payload.ads : []
        };
      }
      return {teachers: DEFAULT_TEACHERS, config: DEFAULT_CONFIG, ads: []};
    }

    async function init() {
      const data = await loadData();
      teachers = data.teachers;
      config = data.config;
      ads = data.ads;
      scheduleHalfFlip();
      render();
      scheduleAutoRotate();
      setInterval(async () => {
        const fresh = await loadData();
        teachers = fresh.teachers;
        config = fresh.config;
        ads = fresh.ads;
        if (teacherIdx >= teachers.length) teacherIdx = 0;
      }, 60000);
    }

    // ---- Режим попереднього перегляду для адмінки: index.html?annpreview=1 ----
    // Адмінка вставляє цю сторінку в iframe і надсилає оголошення через postMessage —
    // тож перегляд рендериться тим самим кодом, що й на TV. Дані/ротація тут не потрібні.
    if (new URLSearchParams(location.search).has('annpreview')) {
      document.body.classList.add('ann-preview');
      window.addEventListener('message', e => {
        if (e.origin !== location.origin) return;
        const m = e.data;
        if (!m || m.type !== 'rozklad-ann-preview' || !m.ad) return;
        sceneEl.hidden = true;
        annSceneEl.hidden = false;
        annSceneEl.classList.remove('fade');
        renderAd(m.ad);
      });
    } else {
      init();
    }
  </script>
</body>

</html>
