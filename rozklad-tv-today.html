<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <title>Розклад на сьогодні — TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a1120;
      --panel: #101a2e;
      --gold: #d4a72c;
      --live: #ff6b35;
      --text: #f4f0e6;
      --muted: #5f7189;
      --divider: #22314c;
      --today-tint: rgba(212, 167, 44, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .board {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(1200px 600px at 85% -10%, rgba(212, 167, 44, 0.08), transparent 60%), var(--bg);
    }

    /* ---- Top bar ---- */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 44px 12px;
    }

    .inst-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-img {
      max-width: 300px;
      object-fit: contain;
    }

    .inst {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .week-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: 6px 16px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .clock {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 38px;
      color: var(--gold);
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .clock .date {
      font-size: 18px;
      color: var(--muted);
      font-weight: 400;
      text-transform: capitalize;
    }

    /* ---- Day title ---- */
    .day-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 4px 44px 14px;
    }

    .day-title h1 {
      font-family: 'Unbounded', sans-serif;
      font-weight: 900;
      font-size: 40px;
      text-transform: capitalize;
    }

    .day-title .slide-info {
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      font-size: 16px;
    }

    /* ---- Rows ---- */
    .scene {
      flex: 1;
      min-height: 0;
      padding: 0 44px 10px;
      display: flex;
      flex-direction: column;
      opacity: 1;
      transition: opacity 0.45s ease;
    }

    .scene.fade {
      opacity: 0;
    }

    .rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--divider);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
      padding: 10px;
    }

    .row {
      flex: 1;
      display: grid;
      grid-template-columns: 190px 1fr;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--divider);
      position: relative;
      min-height: 0;
    }

    .row.live {
      background: linear-gradient(160deg, rgba(255, 107, 53, 0.16), rgba(255, 107, 53, 0.04));
      box-shadow: inset 0 0 0 2px var(--live);
    }

    .row .time-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.025);
      border-right: 1px solid var(--divider);
      padding: 6px;
      text-align: center;
    }

    .row .pair-num {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .row .t1 {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 26px;
      margin-top: 4px;
    }

    .row .t2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: var(--muted);
    }

    .live-tag {
      position: absolute;
      top: 8px;
      right: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--live);
      letter-spacing: .5px;
      animation: pulse 1.6s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .4;
      }
    }

    .entries {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 6px;
      padding: 8px 20px;
      overflow: hidden;
      min-height: 0;
    }

    .entry {
      display: grid;
      grid-template-columns: 56px 1fr auto auto;
      align-items: center;
      gap: 14px;
    }

    .entry+.entry {
      border-top: 1px dashed var(--divider);
      padding-top: 6px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--gold), #8a6d1a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #0a1120;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .entry .who .teacher {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 19px;
      line-height: 1.2;
    }

    .entry .who .subj {
      font-size: 15px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.25;
    }

    .entry .group {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    .entry .room {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 18px;
      color: var(--gold);
      text-align: right;
      white-space: nowrap;
      min-width: 78px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: var(--muted);
    }

    .empty-state .big {
      font-family: 'Unbounded', sans-serif;
      font-size: 30px;
      color: var(--text);
    }

    /* ---- Footer ---- */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 48px 20px;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--divider);
    }

    .dot.active {
      background: var(--gold);
      width: 24px;
      border-radius: 5px;
      transition: all .3s;
    }

    /* ---- Banner ---- */
    .banner {
      width: 100%;
      height: 70px;
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--divider);
    }

    /* ---- Debug panel ---- */
    .debug-panel {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 999;
      background: rgba(10, 17, 32, 0.95);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .debug-panel.show {
      display: block;
    }

    .debug-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .debug-hint {
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 11px;
    }

    .debug-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .debug-label {
      color: var(--muted);
      min-width: 150px;
    }

    .debug-value {
      color: var(--text);
      font-weight: 700;
    }

    .debug-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--divider);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
    }

    .debug-btn.active {
      background: var(--gold);
      color: #0a1120;
      border-color: var(--gold);
    }
  </style>
</head>

<body>
  <div class="board">
    <div class="topbar">
      <div class="inst-group">
        <img id="logoImg" class="logo-img" style="display:none">
        <div class="inst">Розклад на сьогодні</div>
      </div>
      <div class="topbar-right">
        <div class="week-badge" id="weekbadge">—</div>
        <div class="clock"><span id="time">--:--:--</span><span class="date" id="date">—</span></div>
      </div>
    </div>

    <div class="banner" id="banner" style="display:none"></div>

    <div class="day-title">
      <h1 id="dayName">—</h1>
      <div class="slide-info" id="slideInfo"></div>
    </div>

    <div class="scene" id="scene">
      <div class="rows" id="rows"></div>
    </div>

    <div class="footer">
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <!-- ==================== ДЕБАГ-ПАНЕЛЬ (натисніть «d», щоб показати/сховати) ==================== -->
  <div class="debug-panel" id="debugPanel">
    <div class="debug-title">Дебаг-режим <span class="debug-hint">(клавіша D — сховати)</span></div>
    <div class="debug-row">
      <span class="debug-label">День:</span>
      <button class="debug-btn" id="dbgDayAuto" data-day="auto">Авто</button>
      <button class="debug-btn" data-day="Понеділок">Пн</button>
      <button class="debug-btn" data-day="Вівторок">Вт</button>
      <button class="debug-btn" data-day="Середа">Ср</button>
      <button class="debug-btn" data-day="Четвер">Чт</button>
      <button class="debug-btn" data-day="П'ятниця">Пт</button>
    </div>
    <div class="debug-row">
      <span class="debug-label">Тиждень:</span>
      <button class="debug-btn" id="dbgWeekAuto" data-week="auto">Авто</button>
      <button class="debug-btn" data-week="numerator">Чисельник</button>
      <button class="debug-btn" data-week="denominator">Знаменник</button>
    </div>
    <div class="debug-row">
      <span class="debug-label">Реальний день сьогодні:</span>
      <span class="debug-value" id="dbgRealDay">—</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Розрахований тиждень (авто):</span>
      <span class="debug-value" id="dbgAutoWeek">—</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Слайд:</span>
      <button class="debug-btn" id="dbgNextSlide">Наступний ▶</button>
    </div>
  </div>

  <script>
    // ===================== Конфіг =====================
    const DEFAULT_CONFIG = {
      semesterStart: "2026-09-01",
      scheduleUrl: "",
      logo: "",
      banner: ""
    };

    const WEEKDAYS = ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця"];

    const PERIODS = [
      { num: 1, time: "08:30-09:50" },
      { num: 2, time: "10:10-11:30" },
      { num: 3, time: "11:50-13:10" },
      { num: 4, time: "13:30-14:50" },
      { num: 5, time: "15:05-16:25" },
      { num: 6, time: "16:40-18:00" },
      { num: 7, time: "18:10-19:30" },
      { num: 8, time: "19:40-21:00" },
    ];

    // Скільки карток (рядків) показувати на одному слайді.
    const ROWS_PER_SLIDE = 3;
    // Скільки викладачів максимум показуємо в одній картці пари.
    // Якщо їх більше — пара автоматично розбивається на кілька карток,
    // щоб текст ніколи не накладався і не обрізався.
    const MAX_ENTRIES_PER_ROW = 4;
    const ROTATE_MS = 10000;

    let teachers = [];
    let config = DEFAULT_CONFIG;
    let slides = [];       // масив слайдів; кожен — масив карток-рядків
    let slideIdx = 0;

    // ---- Дебаг: ручне перемикання дня тижня + типу тижня (клавіша D) ----
    let dayOverride = null;  // null = реальний сьогоднішній день, або одне з WEEKDAYS
    let weekOverride = null; // null = авто, або 'numerator' / 'denominator'

    function initials(name) { return (name || '').trim().split(" ").filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase(); }
    function toMin(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }

    function mondayOf(d) {
      const day = d.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
    }
    function getWeekType(semesterStart) {
      const start = mondayOf(new Date(semesterStart + "T00:00:00"));
      const now = mondayOf(new Date());
      const diffDays = Math.round((now - start) / 86400000);
      const weeksDiff = Math.floor(diffDays / 7);
      const mod = ((weeksDiff % 2) + 2) % 2;
      return mod === 0 ? "numerator" : "denominator";
    }

    function applyBrand() {
      const logoImg = document.getElementById('logoImg');
      if (config.logo) { logoImg.src = config.logo; logoImg.style.display = ''; }
      else { logoImg.style.display = 'none'; }

      const banner = document.getElementById('banner');
      if (config.banner) { banner.style.backgroundImage = `url("${config.banner}")`; banner.style.display = ''; }
      else { banner.style.display = 'none'; }
    }

    // ---- Будуємо список усіх занять на сьогодні, згрупований за парами ----
    function buildTodayByPeriod(todayName, weekType) {
      const byPeriod = {}; // num -> [entry, ...]
      PERIODS.forEach(p => byPeriod[p.num] = []);

      teachers.forEach(t => {
        const week = (t.schedule && t.schedule[weekType]) || {};
        const lessons = week[todayName] || [];
        lessons.forEach(l => {
          const num = Number(l.period);
          if (!byPeriod[num]) return;
          byPeriod[num].push({
            teacher: t.name,
            photo: t.photo,
            photoPos: t.photoPos,
            subj: l.subj,
            group: l.group,
            room: l.room,
            half: l.half || null
          });
        });
      });

      // сортуємо викладачів усередині пари за прізвищем
      Object.keys(byPeriod).forEach(num => {
        byPeriod[num].sort((a, b) => (a.teacher || '').localeCompare(b.teacher || '', 'uk'));
      });

      return byPeriod;
    }

    function chunkArray(arr, size) {
      const out = [];
      for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
      return out;
    }

    // ---- З періодів робимо "картки-рядки": якщо в парі забагато викладачів,
    //      ділимо її на кілька карток по MAX_ENTRIES_PER_ROW осіб у кожній ----
    function buildRowBlocks(byPeriod) {
      const blocks = [];
      PERIODS.forEach(p => {
        const list = byPeriod[p.num];
        if (!list || !list.length) return;
        const chunks = chunkArray(list, MAX_ENTRIES_PER_ROW);
        chunks.forEach((chunk, idx) => {
          blocks.push({ period: p, entries: chunk, part: idx + 1, partsTotal: chunks.length });
        });
      });
      return blocks;
    }

    // ---- Групуємо картки-рядки по ROWS_PER_SLIDE на слайд ----
    function buildSlides(blocks) {
      if (!blocks.length) return [];
      const chunks = [];
      for (let i = 0; i < blocks.length; i += ROWS_PER_SLIDE) {
        chunks.push(blocks.slice(i, i + ROWS_PER_SLIDE));
      }
      return chunks;
    }

    function avatarHtml(entry) {
      if (entry.photo) {
        const pos = entry.photoPos || { x: 50, y: 50, zoom: 130 };
        return `<div class="avatar"><img src="${entry.photo}" alt="" style="object-position:${pos.x}% ${pos.y}%; transform:scale(${(pos.zoom / 100).toFixed(2)});"></div>`;
      }
      return `<div class="avatar">${initials(entry.teacher)}</div>`;
    }

    function render() {
      applyBrand();

      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const jsDay = now.getDay();
      const realTodayName = (jsDay >= 1 && jsDay <= 5) ? WEEKDAYS[jsDay - 1] : null;
      const todayName = dayOverride || realTodayName;
      const isRealToday = (todayName === realTodayName);

      const autoWeekType = getWeekType(config.semesterStart);
      const weekType = weekOverride || autoWeekType;
      document.getElementById('weekbadge').textContent = weekType === 'numerator' ? 'Чисельник' : 'Знаменник';
      document.getElementById('dayName').textContent = todayName || 'Вихідний';
      updateDebugPanel(realTodayName, autoWeekType);

      const rowsEl = document.getElementById('rows');
      const dotsEl = document.getElementById('dots');
      const slideInfoEl = document.getElementById('slideInfo');

      if (!teachers.length || !todayName) {
        rowsEl.innerHTML = `<div class="empty-state">
            <div class="big">${!teachers.length ? 'Немає даних' : 'Сьогодні вихідний'}</div>
            <div>${!teachers.length ? 'Додайте викладачів в адмінці та експортуйте schedule.json' : 'Занять не заплановано'}</div>
          </div>`;
        dotsEl.innerHTML = '';
        slideInfoEl.textContent = '';
        return;
      }

      const byPeriod = buildTodayByPeriod(todayName, weekType);
      const blocks = buildRowBlocks(byPeriod);
      slides = buildSlides(blocks);

      if (!slides.length) {
        rowsEl.innerHTML = `<div class="empty-state">
            <div class="big">На сьогодні занять немає</div>
            <div>Перевірте розклад — можливо, це вікно між семестрами</div>
          </div>`;
        dotsEl.innerHTML = '';
        slideInfoEl.textContent = '';
        return;
      }

      if (slideIdx >= slides.length) slideIdx = 0;
      const slide = slides[slideIdx];

      rowsEl.innerHTML = slide.map(block => {
        const p = block.period;
        const [t1, t2] = p.time.split('-');
        const isLive = isRealToday && nowMin >= toMin(t1) && nowMin <= toMin(t2);
        const entriesHtml = block.entries.map(e => {
          const halfTag = e.half ? `<span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);margin-right:6px;">${e.half}-ша пол.</span>` : '';
          return `<div class="entry">
              ${avatarHtml(e)}
              <div class="who">
                <div class="teacher">${e.teacher}</div>
                <div class="subj">${halfTag}${e.subj}</div>
              </div>
              <div class="group">${e.group || ''}</div>
              <div class="room">${e.room ? 'ауд. ' + e.room : ''}</div>
            </div>`;
        }).join('');

        return `<div class="row ${isLive ? 'live' : ''}">
            ${isLive ? '<span class="live-tag">● ЗАРАЗ</span>' : ''}
            <div class="time-col">
              <div class="pair-num">${p.num} пара${block.partsTotal > 1 ? ` · ч.${block.part}/${block.partsTotal}` : ''}</div>
              <div class="t1">${t1}</div>
              <div class="t2">${t2}</div>
            </div>
            <div class="entries">${entriesHtml}</div>
          </div>`;
      }).join('');

      dotsEl.innerHTML = slides.map((_, i) => `<div class="dot ${i === slideIdx ? 'active' : ''}"></div>`).join('');
      slideInfoEl.textContent = `Слайд ${slideIdx + 1} з ${slides.length}`;
    }

    // ---- Дебаг-панель: індикація та перемикання ----
    function updateDebugPanel(realTodayName, autoWeekType) {
      document.getElementById('dbgRealDay').textContent = realTodayName || 'вихідний';
      document.getElementById('dbgAutoWeek').textContent = autoWeekType === 'numerator' ? 'Чисельник' : 'Знаменник';

      document.querySelectorAll('[data-day]').forEach(btn => {
        const isActive = btn.dataset.day === 'auto' ? dayOverride === null : btn.dataset.day === dayOverride;
        btn.classList.toggle('active', isActive);
      });
      document.querySelectorAll('[data-week]').forEach(btn => {
        const isActive = btn.dataset.week === 'auto' ? weekOverride === null : btn.dataset.week === weekOverride;
        btn.classList.toggle('active', isActive);
      });
    }

    document.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'd') {
        document.getElementById('debugPanel').classList.toggle('show');
      }
    });
    document.querySelectorAll('[data-day]').forEach(btn => {
      btn.onclick = () => {
        dayOverride = btn.dataset.day === 'auto' ? null : btn.dataset.day;
        slideIdx = 0;
        render();
      };
    });
    document.querySelectorAll('[data-week]').forEach(btn => {
      btn.onclick = () => {
        weekOverride = btn.dataset.week === 'auto' ? null : btn.dataset.week;
        slideIdx = 0;
        render();
      };
    });
    document.getElementById('dbgNextSlide').onclick = () => rotateSlide();

    function tick() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('uk-UA');
      document.getElementById('date').textContent = now.toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    setInterval(tick, 1000); tick();

    const FADE_MS = 450;
    function rotateSlide() {
      if (slides.length < 2) { render(); return; }
      const scene = document.getElementById('scene');
      scene.classList.add('fade');
      setTimeout(() => {
        slideIdx = (slideIdx + 1) % slides.length;
        render();
        requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.remove('fade')));
      }, FADE_MS);
    }

    // ---- Завантаження даних (той самий формат schedule.json, що й основний TV-екран) ----
    async function fetchJson(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('bad status');
      return res.json();
    }

    async function loadData() {
      let payload = null;
      try { payload = await fetchJson('schedule.json'); } catch (e) { }

      if (payload && payload.config && payload.config.scheduleUrl) {
        try { payload = await fetchJson(payload.config.scheduleUrl); } catch (e) { }
      }

      if (!payload) {
        try {
          const raw = localStorage.getItem('rozklad_data');
          if (raw) payload = JSON.parse(raw);
        } catch (e) { }
      }

      if (payload && Array.isArray(payload.teachers) && payload.teachers.length) {
        return {
          teachers: payload.teachers,
          config: Object.assign({}, DEFAULT_CONFIG, payload.config || {})
        };
      }
      return { teachers: [], config: DEFAULT_CONFIG };
    }

    async function init() {
      const data = await loadData();
      teachers = data.teachers;
      config = data.config;
      render();
      setInterval(rotateSlide, ROTATE_MS);
      // раз на хвилину — перечитуємо джерело і перебудовуємо (без різкого стрибка слайду)
      setInterval(async () => {
        const fresh = await loadData();
        teachers = fresh.teachers;
        config = fresh.config;
        render();
      }, 60000);
    }
    init();
  </script>
</body>

</html>
